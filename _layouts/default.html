<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- WHAT: the seo tag writes the page title, description and share-preview
       image tags for you, using each page's front matter (title, excerpt, image).
       WHY: this is what makes a shared post link look right on LinkedIn. -->
  {% seo %}
  {% feed_meta %}
</head>
<body>

  <!-- ============ NAVIGATION (written once, used on every page that uses this layout) ============ -->
  <nav>
    <a href="{{ '/index.html' | relative_url }}" class="logo">Emily<span> Todd</span></a>
    <ul>
      <li><a href="{{ '/index.html' | relative_url }}">Home</a></li>
      <li><a href="{{ '/blog.html' | relative_url }}" {% if page.url contains '/blog' %}class="active"{% endif %}>Blog</a></li>
      <li><a href="{{ '/resources.html' | relative_url }}">Resources</a></li>
    </ul>
  </nav>

  {{ content }}

  <footer>
    <p>© 2026 Emily Todd · Built with ☕ and curiosity</p>
  </footer>

</body>
</html>
